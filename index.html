<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>No Steps, Only Leaps!</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading">
      <div id="loading-title">No Steps, Only Leaps!</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-message"></div>
      <div id="rotate-hint">Rotate your device to landscape</div>
    </div>

    <button id="fullscreen-button" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/>
      </svg>
    </button>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/NoStepsOnlyLeaps-WebBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/NoStepsOnlyLeaps-WebBuild.data",
        frameworkUrl: buildUrl + "/NoStepsOnlyLeaps-WebBuild.framework.js",
        codeUrl: buildUrl + "/NoStepsOnlyLeaps-WebBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "No Steps, Only Leaps!",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingMessage = document.querySelector("#loading-message");
      var fullscreenButton = document.querySelector("#fullscreen-button");

      document.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      document.addEventListener("gesturestart", function (event) { event.preventDefault(); });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          loadingFill.style.width = (progress * 100) + "%";
        }).then(function () {
          loading.classList.add("hidden");
          canvas.focus();
        }).catch(function (message) {
          loadingMessage.textContent = "Could not load the game. Please refresh the page.";
          console.error(message);
        });
      };
      script.onerror = function () {
        loadingMessage.textContent = "Could not load the game. Please refresh the page.";
      };
      document.body.appendChild(script);

      var canFullscreen = !!(document.documentElement.requestFullscreen);
      if (!canFullscreen) {
        fullscreenButton.style.display = "none";
      }

      fullscreenButton.addEventListener("click", function () {
        if (document.fullscreenElement) {
          document.exitFullscreen();
          return;
        }
        document.documentElement.requestFullscreen();
      });

      var hideTimer = 0;
      document.addEventListener("mousemove", function () {
        fullscreenButton.classList.add("visible");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { fullscreenButton.classList.remove("visible"); }, 2000);
      });
    </script>
  </body>
</html>
